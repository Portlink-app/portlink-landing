# Minimal CI for portlink-landing (14.11.2026). Runs the repo's own `npm run verify` on GitHub's hosted
# runner. Chose: ubuntu-latest. Over: the shared self-hosted `portlink-studio` runners. Because: this repo
# is public and accepts fork PRs, so a self-hosted runner would execute outside code on a founder's server,
# and hosted minutes are free on public repos. Revisit-if: the repo goes private.
# Not a required check yet: make it one once it has run green.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
