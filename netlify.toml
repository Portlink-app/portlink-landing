[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Pages stay uncached, so a content change is live the moment it deploys.
#
# The security headers ride on the same blanket rule. HSTS and X-Content-Type-Options were already
# being sent by Netlify; these three were not. Deliberately NOT a Content-Security-Policy: Next
# emits inline scripts for hydration and the flight payload, so a CSP here needs nonce plumbing and
# gets one thing wrong in a way that blanks the page. That is its own work item, not a line in a
# cache rule.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Media is cached hard, and the path carries the version that makes that safe:
# a re-cut lands in a new dated directory rather than fighting a year-long
# immutable entry on a filename that never changes.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share card, on the same terms as the film and for the same reason: the filename carries its
# date, so a new card is a new path rather than an edit fighting a year-long immutable entry. A
# link-preview crawler refetches this on every share, and under the blanket /* rule above that is
# an origin hit every time.
[[headers]]
  for = "/og/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Next's own build output is content-hashed, so it is immutable by construction.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
