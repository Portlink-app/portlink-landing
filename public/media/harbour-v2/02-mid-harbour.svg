<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4800 2400">
<title>One Harbour v2, layer 02: mid harbour</title>
<desc>World 4800 x 2400. Parallax fx 0.82, fy 1. The town hill behind the quay: terminal apron, sheds, tanks, floodlight masts, 38 houses from two symbols (hg gable front, he eaves front), church, telecom mast. The land base runs to y 1440 so the water layer always covers its foot. Town windows are stage-line grey, never signal.</desc>
