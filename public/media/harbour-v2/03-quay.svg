<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 4800 2400">
<title>One Harbour v2, layer 03: quay</title>
<desc>World 4800 x 2400. Parallax fx 1, fy 1 (the reference plane). Breakwater, quay wall (apron top y 1340, waterline y 1420), container stacks, portal jib crane, mobile harbour crane, terminal tractor, the port agent's office (anchor-A2), the DMC house (anchor-A3), coach, rock shore, the Embark guide hut with kayak rack and jetty (anchor-A4). Signal colour appears only inside lights-A2, lights-A3 and lights-A4. Anything below y 1420 is covered by the water layer.</desc>
