<title>One Harbour v2, layer 04: water</title>
<desc>World 4800 x 2400. Parallax fx 1, fy 1. Near water from the waterline (y 1420) down, reflections, wave marks, the lighthouse skerry, icebergs and brash ice, harbour craft, the anchorage buoy (anchor-A1, station 1380 1610) and the Embark tour boat (anchor-A5, station 3520 1690). The ship sprite is drawn after this layer, so every object here either has its base above the route or its top below the ship's hull. Signal colour appears only inside lights-* groups.</desc>
